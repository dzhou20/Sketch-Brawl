[tool.poetry]
name = "sketch-brawl-backend"
version = "0.1.0"
description = "FastAPI backend for Sketch Brawl demo"
authors = ["Sketch Brawl Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.2"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlmodel = "^0.0.21"
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.9"
redis = "^5.1.0"
celery = "^5.4.0"
python-dotenv = "^1.0.1"
aiofiles = "^23.2.1"
numpy = "^2.1.3"
pydantic = "^2.9.2"
structlog = "^24.1.0"
boto3 = "^1.35.42"
onnxruntime = "^1.23.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
hypothesis = "^6.116.2"
httpx = "^0.27.2"
ruff = "^0.6.9"
alembic = "^1.17.2"
