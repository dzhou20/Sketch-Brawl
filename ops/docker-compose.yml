version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: sketch-brawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brawl
      POSTGRES_PASSWORD: brawl
      POSTGRES_DB: brawl
    ports:
      - "5432:5432"
    volumes:
      - ../postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sketch-brawl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: sketch-brawl-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: demo
      MINIO_ROOT_PASSWORD: demo-demo
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../minio-data:/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    container_name: sketch-brawl-backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://brawl:brawl@postgres:5432/brawl
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: ["./docker-entrypoint.sh"]

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: sketch-brawl-frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
